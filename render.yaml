# Render Blueprint (render.yaml) for Clario Frontend & Backend Deployment
# Backend Service URL: https://customer-guard-ai.onrender.com

services:
  # 1. Backend Web Service (customer-guard-ai)
  - type: web
    name: customer-guard-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: VITE_API_BASE_URL
        value: https://customer-guard-ai.onrender.com

  # 2. Frontend Static Site (clario-frontend)
  - type: web
    name: clario-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://customer-guard-ai.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
