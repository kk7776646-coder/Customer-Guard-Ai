# Render Blueprint (render.yaml) for Clario Frontend & Full-Stack Deployment

services:
  # Option A: Full-Stack Web Service (Node.js API + Static Assets)
  - type: web
    name: customer-guard-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

  # Option B: Frontend Static Site Only (Vite SPA)
  - type: static
    name: clario-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
